[package]
name = "palicode"
version = "0.6.3"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
dirs = "7.0.0"
futures-util = "0.3.34"
globset = "0.4.21"
ignore = "0.4.34"
libc = "0.2.191"
pulldown-cmark = "0.13.5"
ratatui = "0.30.2"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls", "gzip", "http2"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
similar = "3.2.1"
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
textwrap = "0.16.4"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.0", features = ["v4"] }
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"
