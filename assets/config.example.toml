# palicode configuration
# Location: ~/.config/palicode/config.toml (override with $PALICODE_CONFIG)

[general]
theme = "mono-dark"
approval_mode = "suggest" # suggest | auto-edit | full-auto
log_level = "warn"        # error | warn | info | debug | trace
# default_provider = "ollama"
# default_model = "qwen3.5:9b"
max_steps = 32
# Compact older context once the transcript grows beyond this many characters.
compact_after_chars = 120000
compact_keep_messages = 12
# Optional verification command run after plan execution; failures trigger
# self-heal turns (up to verify_retries).
# verify_command = "cargo test"
verify_retries = 1
handoff_on_exit = true
# system_prompt = "You are palicode, a concise coding agent."

[providers]
# OpenCode Console (pay-as-you-go gateway).
# Set OPENCODE_API_KEY, or press F2 in the TUI and paste a key. Stored keys live
# in ~/.config/palicode/credentials.toml with mode 0600 and are never written to
# config.toml. The environment variable takes precedence when both are set.
[[providers.list]]
name = "opencode"
type = "openai_compatible"
base_url = "https://opencode.ai/inference/openai/v1"
models_url = "https://opencode.ai/inference/v1/models"
api_key_env = "OPENCODE_API_KEY"
default_model = "deepseek-v4.1-flash"
stream_usage = true

# Ollama (local). OLLAMA_HOST overrides base_url, e.g. OLLAMA_HOST=127.0.0.1:11434
[[providers.list]]
name = "ollama"
type = "openai_compatible"
base_url = "http://localhost:11434/v1"
default_model = "qwen3.5:9b"

[tools]
shell = "/bin/sh"
shell_timeout_secs = 120
max_output_bytes = 60000
max_read_lines = 2000
path_sandbox = true
# sandbox_root = "/home/you/projects" # defaults to the working directory

[permissions]
# Rules use globs for the tool name and an optional subject (command/path/prompt).
# Built-in safety denies always apply. A matching deny wins; otherwise the first
# matching allow/ask rule applies.
# [[permissions.rules]]
# tool = "run_shell"
# pattern = "git push*"
# action = "ask"        # allow | ask | deny
# [[permissions.rules]]
# tool = "write_file"
# pattern = "**/.env*"
# action = "deny"

[tui]
mouse = true
vim_nav = true
